<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>{{Subject}}</title>
</head>
<body style="background-color: #ffd8b1; font-family: Arial, sans-serif; padding: 20px;">

    <table width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
            <td align="center">
                <table width="600" cellpadding="10" cellspacing="0" border="0"
                       style="background: #fff; border: 5px solid #000; border-radius: 15px;">

                    <!-- Header -->
                    <tr>
                        <td align="center">
                            <h2 style="font-size: 24px; color: #D21D5F; text-shadow: -2px 2px #000;">{{Header}}</h2>
                        </td>
                    </tr>

                    <!-- Body -->
                    <tr>
                        <td style="font-size: 18px; color: #444; padding-left: 40px; padding-right: 40px;">
                            <p>{{Body}}</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

        <!-- Add break for spacing -->
        <tr>
            <td>
                <br>
            </td>
        </tr>

        <!-- Footer -->
        <tr>
            <td align="center">
                <table width="600" cellpadding="10" cellspacing="0" border="0">
                    <tr>
                        <td align="center" style="font-size: 12px; color: #888; border-top: 1px dashed #000;">
                            <p>© 2025 XAMPL - Sweet Vibes Only 🍩</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

</body>
</html>
